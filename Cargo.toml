[package]
name = "simpletaskmgr"
version = "1.0.0-beta.1"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "A simple GTK4 task manager: CPU/Mem/Disk graphs, a process list, and Terminate/Kill (SIGTERM/SIGKILL) from the detail pane"
repository = "https://github.com/paulez/simpletaskmgr"
keywords = ["gtk", "task-manager", "system-monitor", "process"]
categories = ["gui"]

[dependencies]
gtk4 = { version = "0.11", features = ["v4_18"] }
log = "0.4.33"
procfs = "0.18.0"
simplelog = "0.12.2"
users = "0.11.0"
anyhow = "1.0.104"
libc = "0.2.189"
chrono = "0.4"
cairo-rs = "0.22"
glib = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "5"

[lib]
name = "simpletaskmgr"
path = "src/lib.rs"

[[bin]]
name = "simpletaskmgr"
path = "src/main.rs"

[dev-dependencies]
rstest = "0.26.1"
