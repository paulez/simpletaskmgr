name: Release

on:
  push:
    tags: ["v*"]

# Required for `gh release create` to publish the release
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
      options: --user root
    env:
      PATH: /root/.cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      RUSTUP_HOME: /root/.rustup
      CARGO_HOME: /root/.cargo
    steps:
    - name: Install build dependencies (Debian 13)
      run: |
        export DEBIAN_FRONTEND=noninteractive
        apt-get update
        apt-get install -y --no-install-recommends \
          ca-certificates \
          curl \
          git \
          bash \
          build-essential \
          pkg-config \
          libgtk-4-dev \
          gh \
          squashfs-tools \
          file \
          cage \
          grim \
          procps
    - name: Install Rust (stable, gtk-rs requires rustc >= 1.92)
      run: |
        curl -sSf https://sh.rustup.rs | HOME=/root sh -s -- -y --profile minimal --default-toolchain stable
        rustc --version
        cargo --version
    - uses: actions/checkout@v4
    - name: Verify tag matches Cargo.toml version
      id: version
      shell: bash # container steps default to sh (dash); regex below is bash
      run: |
        tag="${GITHUB_REF_NAME#v}"
        version="$(grep -m1 '^version[[:space:]]*=' Cargo.toml | cut -d'"' -f2)"
        # Full X.Y.Z, or a semver prerelease (X.Y.Z-beta.1, X.Y.Z-rc.2, ...).
        # Build metadata (+...) is not supported: it would create two
        # artifacts indistinguishable under the same X.Y.Z[-prerelease].
        if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
          echo "::error::Cargo.toml version '$version' is not valid semver (X.Y.Z or X.Y.Z-prerelease, e.g. 1.0.0-rc.1)"
          exit 1
        fi
        if [ "$tag" != "$version" ]; then
          echo "::error::Tag '${GITHUB_REF_NAME}' does not match Cargo.toml version '$version'"
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"
    - name: Build release binary
      run: cargo build --release --locked
    - name: Package artifacts (native tarball + portable AppImage)
      shell: bash
      run: |
        V="${{ steps.version.outputs.version }}"
        # --- native tarball (needs host GTK4) ---
        PKG="simpletaskmgr-${V}-x86_64-linux"
        mkdir -p "dist/${PKG}"
        cp target/release/simpletaskmgr "dist/${PKG}/"
        cp README.md LICENSE "dist/${PKG}/"
        tar -czf "dist/${PKG}.tar.gz" -C dist "${PKG}"
        # --- self-contained AppImage (bundled GTK closure, no host deps) ---
        bash scripts/package-appimage.sh
        # --- checksums for both artifacts ---
        ( cd dist && sha256sum "${PKG}.tar.gz" "simpletaskmgr-${V}-x86_64.AppImage" > SHA256SUMS && cat SHA256SUMS )
    - name: Smoke test the AppImage under headless Wayland
      shell: bash
      run: |
        set -euo pipefail
        V="${{ steps.version.outputs.version }}"
        OUT="dist/simpletaskmgr-${V}-x86_64.AppImage"
        [ -f "$OUT" ] || { echo "AppImage missing: $OUT"; exit 1; }
        CR="$(mktemp -d "${TMPDIR:-/tmp}/cage-XXXXXX")"
        cleanup(){ kill "${CAGE_PID:-}" 2>/dev/null; pkill -x simpletaskmgr 2>/dev/null; rm -rf "$CR"; }
        trap cleanup EXIT
        # cage runs the app on a headless Wayland compositor. APPIMAGE_EXTRACT_AND_RUN
        # is the FUSE-free launch path (GitHub runners have no /dev/fuse). An AppImage
        # does NOT sandbox the PID namespace, so the app must start and be enumerable
        # in the surrounding PID namespace — the "it can see real processes" proof.
        APPIMAGE_EXTRACT_AND_RUN=1 WLR_BACKENDS=headless WAYLAND_DISPLAY= XDG_RUNTIME_DIR="$CR" \
          DBUS_SESSION_BUS_ADDRESS=disabled \
          cage -- "./${OUT}" > /tmp/cage.log 2>&1 &
        CAGE_PID=$!
        ok=0; for _ in $(seq 1 60); do [ -S "$CR/wayland-0" ] && { ok=1; break; }; sleep 0.2; done
        [ "$ok" = 1 ] || { echo "cage did not come up:"; cat /tmp/cage.log; exit 1; }
        apppid=""; for _ in $(seq 1 90); do apppid="$(pgrep -x simpletaskmgr || true)"; [ -n "$apppid" ] && break; sleep 0.25; done
        [ -n "$apppid" ] || { echo "APP FAILED TO LAUNCH:"; cat /tmp/cage.log; exit 1; }
        sleep 3   # give GTK time to map a window
        echo "APP LIVE: pid=${apppid} comm=$(cat /proc/${apppid}/comm 2>/dev/null)"
        n=$(ls /proc | grep -cE '^[0-9]+$')
        echo "app-enumerable PIDs: ${n}  (pid1=$(cat /proc/1/comm 2>/dev/null))"
        if command -v grim >/dev/null && [ -S "$CR/wayland-0" ]; then
          WAYLAND_DISPLAY=wayland-0 XDG_RUNTIME_DIR="$CR" grim "$CR/appimage_render.png"
          [ -s "$CR/appimage_render.png" ] && echo "screenshot: $(du -h "$CR/appimage_render.png" | cut -f1)"
        fi
        echo "smoke test passed: AppImage launches and draws a window"
    - name: Create GitHub release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      shell: bash # arrays and [[ ]] below are bash
      run: |
        # gh resolves the repo through git; the workspace copy is owned by
        # another uid than the container user, so allow it explicitly.
        git config --global --add safe.directory "${GITHUB_WORKSPACE}"
        V="${{ steps.version.outputs.version }}"
        # `gh release create` attaches the source tarball/zip for the tag
        # automatically, plus the binary artifacts listed below.
        # A prerelease (e.g. 1.0.0-rc.1) is marked as such so it is not
        # offered as "Latest" until the final version ships.
        ARGS=(--title "v${V}" --generate-notes)
        [[ "$V" == *-* ]] && ARGS+=(--prerelease)
        gh release create "v${V}" "${ARGS[@]}" \
          "dist/simpletaskmgr-${V}-x86_64-linux.tar.gz" \
          "dist/simpletaskmgr-${V}-x86_64.AppImage" \
          "dist/SHA256SUMS"

  # Publishes the same version to crates.io so that
  # `cargo install simpletaskmgr [--version <tag>]` works. Runs alongside
  # `release` (independent, so a hiccup on one side does not block the
  # other) and publishes exactly once per version — crates are immutable
  # and `cargo publish` fails loudly if the version was already taken.
  publish-crate:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
      options: --user root
    env:
      PATH: /root/.cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      RUSTUP_HOME: /root/.rustup
      CARGO_HOME: /root/.cargo
    steps:
    - name: Install build dependencies (Debian 13)
      run: |
        export DEBIAN_FRONTEND=noninteractive
        apt-get update
        apt-get install -y --no-install-recommends \
          ca-certificates \
          curl \
          git \
          bash
    - name: Install Rust (stable)
      run: |
        curl -sSf https://sh.rustup.rs | HOME=/root sh -s -- -y --profile minimal --default-toolchain stable
        rustc --version
        cargo --version
    - uses: actions/checkout@v4
    - name: Check the crates.io publish token is configured
      env:
        CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      shell: bash
      run: |
        # Fail loudly instead of letting `cargo publish` fall back to an
        # interactive login, which would hang inside the container.
        if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
          echo "::error::Repository secret CARGO_REGISTRY_TOKEN is not set — create a crates.io API token (account 2FA required) and add it as a repository secret named CARGO_REGISTRY_TOKEN"
          exit 1
        fi
    - name: Publish to crates.io
      env:
        CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      run: cargo publish --verbose
