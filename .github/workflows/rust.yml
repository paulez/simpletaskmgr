name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  PATH: /root/.cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  RUSTUP_HOME: /root/.rustup
  CARGO_HOME: /root/.cargo

jobs:
  build:

    runs-on: ubuntu-latest
    container:
      image: debian:trixie
      options: --user root

    steps:
    - name: Install build dependencies (Debian 13, GTK 4.18+)
      run: |
        export DEBIAN_FRONTEND=noninteractive
        apt-get update
        apt-get install -y --no-install-recommends \
          ca-certificates curl git build-essential pkg-config cage libgtk-4-dev
    - name: Install Rust (stable with clippy + rustfmt)
      run: |
        curl -sSf https://sh.rustup.rs | HOME=/root sh -s -- -y --default-toolchain stable
        rustc --version
        cargo --version
        cargo clippy --version
        cargo fmt --version
    - uses: actions/checkout@v4
    - name: Format check
      run: cargo fmt --check
    - name: Lint
      run: cargo clippy --all-targets
    - name: Run tests under headless Wayland (GTK needs a display)
      run: |
        CAGE_RUNTIME="$(mktemp -d "${TMPDIR:-/tmp}/cage-XXXXXX")"
        trap 'rm -rf "${CAGE_RUNTIME}"' EXIT
        WLR_BACKENDS=headless WAYLAND_DISPLAY= XDG_RUNTIME_DIR="${CAGE_RUNTIME}" \
          DBUS_SESSION_BUS_ADDRESS=disabled \
          cage -- sh -c 'WAYLAND_DISPLAY=wayland-0 XDG_RUNTIME_DIR="${CAGE_RUNTIME}" cargo test --verbose'
    - name: Build
      run: cargo build --verbose
