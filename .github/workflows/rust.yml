name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install GTK 4 dev dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-4-dev pkg-config
    - name: Format check
      run: cargo fmt --check
    - name: Lint
      run: cargo clippy --all-targets
    - name: Run tests
      run: cargo test --verbose
    - name: Build
      run: cargo build --verbose
