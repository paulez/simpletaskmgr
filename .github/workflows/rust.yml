name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest
    container:
      image: debian:trixie
      options: --user root

    steps:
    - name: Install build dependencies (Debian 13, GTK 4.18+)
      run: |
        export DEBIAN_FRONTEND=noninteractive
        apt-get update
        apt-get install -y --no-install-recommends \
          ca-certificates curl git build-essential pkg-config \
          rustc cargo rustfmt clippy libgtk-4-dev
    - uses: actions/checkout@v4
    - name: Format check
      run: cargo fmt --check
    - name: Lint
      run: cargo clippy --all-targets
    - name: Run tests
      run: cargo test --verbose
    - name: Build
      run: cargo build --verbose
