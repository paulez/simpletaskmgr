name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install GTK 4 dev dependencies and a virtual display
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-4-dev pkg-config xvfb
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: xvfb-run -a cargo test --verbose
